[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]

# Pinned so that everyone compiles the same bytecode and measures the same gas.
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Solidity libraries, installed by `forge soldeer install` into dependencies/.
[dependencies]
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.7.0"

# remappings.txt is written by hand, so Soldeer must not regenerate it.
[soldeer]
remappings_generate = false

# The seed is fixed so that fuzz and invariant runs, and the gas snapshot, are repeatable.
[fuzz]
runs = 500
seed = "0x435"

[invariant]
runs = 50
depth = 100
# The handler lets calls that the escrow rejects revert; that must not fail the test.
fail_on_revert = false
show_metrics = true
